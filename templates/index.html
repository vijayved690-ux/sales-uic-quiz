<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UIC Management Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: #ffffff; color: #333; }
        .container { max-width: 900px; margin: auto; border: 1px solid #eee; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .header-section { display: flex; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        .logo { height: 60px; margin-right: 20px; }
        .box { border: 1px solid #eaeaea; padding: 20px; margin-bottom: 25px; border-radius: 8px; background-color: #fafafa; }
        input, select, button, textarea { padding: 12px; margin: 8px 0; width: 100%; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: 600; }
        button:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-warning { background-color: #ff9800; }
        #live-feed { background: #fff; border: 1px solid #ccc; padding: 15px; height: 200px; overflow-y: auto; font-family: monospace; }
        .storage-bar-bg { background-color: #e9ecef; border-radius: 5px; height: 15px; width: 100%; overflow: hidden; margin-top: 10px; }
        .storage-bar-fill { background-color: #28a745; height: 100%; width: 0%; transition: width 0.5s; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <div id="logo-container">
                <h2 style="margin: 0; color: #007bff;">UIC</h2>
            </div>
            <div style="margin-left: 10px;">
                <h1 style="margin: 0; font-size: 24px;">Usmanpura Imaging Centre</h1>
            </div>
        </div>

        <div class="box" style="background-color: #f0f7ff;">
            <h3 style="margin-top: 0;">💾 Database Storage (MongoDB Atlas)</h3>
            <div class="storage-bar-bg"><div id="storage-fill" class="storage-bar-fill"></div></div>
            <div style="display: flex; justify-content: space-between; font-size: 13px; margin-top: 5px;">
                <span id="storage-used">Used: 0 MB</span>
                <span id="storage-free">Free: 512 MB</span>
            </div>
        </div>

        <div class="box">
            <h3>1. Add Team Member (Seniours / Buddies)</h3>
            <input type="text" id="name" placeholder="Person Name">
            <input type="text" id="phone" placeholder="WhatsApp Number (e.g. 91...)">
            <select id="role"><option value="Seniours">Seniours</option><option value="Buddies">Buddies</option></select>
            <button onclick="addUser()">Save to UIC Team</button>
        </div>

        <div class="box">
            <h3>2. Actions & Announcement</h3>
            <button onclick="triggerExam()">🚀 Send Daily Report Trigger</button>
            <button class="btn-success" onclick="window.location.href='/export_excel'">📊 Download Excel Report</button>
            <textarea id="announcement_msg" rows="2" placeholder="Type announcement for UIC team..." style="margin-top: 15px;"></textarea>
            <button class="btn-warning" onclick="sendAnnouncement()">📢 Broadcast Message</button>
        </div>

        <div class="box">
            <h3>3. Live Tracking (WhatsApp Activity)</h3>
            <div id="live-feed"><div>Waiting for activity...</div></div>
        </div>
    </div>

    <script>
        var socket = io();
        socket.on('live_update', function(data) {
            var feed = document.getElementById('live-feed');
            feed.innerHTML += "<div>" + data.msg + "</div>";
            feed.scrollTop = feed.scrollHeight;
            updateStorage();
        });

        function updateStorage() {
            fetch('/storage_stats').then(res => res.json()).then(data => {
                document.getElementById('storage-used').innerText = `Used: ${data.used_mb} MB`;
                document.getElementById('storage-free').innerText = `Free: ${data.free_mb} MB`;
                document.getElementById('storage-fill').style.width = data.percent_used + "%";
            });
        }
        window.onload = updateStorage;

        function addUser() {
            let name = document.getElementById('name').value;
            let phone = document.getElementById('phone').value;
            let role = document.getElementById('role').value;
            fetch('/add_user', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name, phone, role})})
            .then(res => res.json()).then(data => { alert(data.message); });
        }

        function triggerExam() {
            if(confirm("Start daily reporting for all?")) fetch('/trigger_exam', {method: 'POST'}).then(res => res.json()).then(data => alert(data.message));
        }

        function sendAnnouncement() {
            let msg = document.getElementById('announcement_msg').value;
            fetch('/send_announcement', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: msg})})
            .then(res => res.json()).then(data => { alert(data.message); document.getElementById('announcement_msg').value = ''; });
        }
    </script>
</body>
</html>
