<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UIC Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background-color: #fff; color: #333; }
        .container { max-width: 950px; margin: auto; border: 1px solid #eee; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .header { border-bottom: 2px solid #007bff; padding-bottom: 15px; margin-bottom: 30px; display: flex; align-items: center; }
        .box { border: 1px solid #eaeaea; padding: 20px; margin-bottom: 25px; border-radius: 8px; background-color: #fafafa; }
        input, select, button, textarea { padding: 12px; margin: 8px 0; width: 100%; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; font-weight: 600; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-warning { background-color: #ff9800; }
        #live-feed { background: #fff; border: 1px solid #ccc; padding: 15px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 14px; }
        .storage-bar { background: #e9ecef; height: 15px; border-radius: 5px; overflow: hidden; margin-top: 10px; }
        #storage-fill { background: #28a745; height: 100%; width: 0%; transition: 0.5s; }
        .q-list { font-size: 14px; margin-top: 10px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="margin:0; color:#007bff;">Usmanpura Imaging Centre</h1>
        </div>

        <div class="box" style="background:#f0f8ff;">
            <h3 style="margin:0;">💾 Database Storage Status</h3>
            <div class="storage-bar"><div id="storage-fill"></div></div>
            <p id="storage-text" style="font-size:12px; margin:5px 0 0 0;">Used: Loading...</p>
        </div>

        <div class="box">
            <h3>⚙️ 1. Set Questions (Sawalaat Set Karein)</h3>
            <input type="text" id="q_text" placeholder="Question Text (e.g. What is your target?)">
            <input type="number" id="q_order" placeholder="Question Order (1, 2, 3...)">
            <select id="q_role"><option value="Seniours">Seniours</option><option value="Buddies">Buddies</option></select>
            <button onclick="addQuestion()">Add Question to Exam</button>
            <div id="q_display" class="q-list"></div>
        </div>

        <div class="box">
            <h3>👥 2. Add Team Member</h3>
            <input type="text" id="u_name" placeholder="Name">
            <input type="text" id="u_phone" placeholder="Phone (91...)">
            <select id="u_role"><option value="Seniours">Seniours</option><option value="Buddies">Buddies</option></select>
            <button onclick="addUser()">Add Person</button>
        </div>

        <div class="box">
            <h3>🚀 3. Actions & Announcements</h3>
            <button onclick="triggerExam()">Start Daily Report (Send Trigger)</button>
            <button class="btn-success" onclick="window.location.href='/export_excel'">Download Results (Excel)</button>
            <textarea id="ann_msg" placeholder="Type announcement message..."></textarea>
            <button class="btn-warning" onclick="sendAnn()">📢 Broadcast Message</button>
        </div>

        <div class="box">
            <h3>📡 4. Live Tracker</h3>
            <div id="live-feed"><div>Waiting for WhatsApp activity...</div></div>
        </div>
    </div>

    <script>
        var socket = io();
        socket.on('live_update', function(data) {
            var feed = document.getElementById('live-feed');
            feed.innerHTML += "<div>" + data.msg + "</div>";
            feed.scrollTop = feed.scrollHeight;
            updateStats();
        });

        function updateStats() {
            fetch('/storage_stats').then(r=>r.json()).then(d=>{
                document.getElementById('storage-text').innerText = `Used: ${d.used_mb} MB / Free: ${d.free_mb} MB`;
                document.getElementById('storage-fill').style.width = d.percent_used + "%";
            });
        }

        function loadQuestions() {
            fetch('/get_questions').then(r=>r.json()).then(data=>{
                let html = "<strong>Current Questions:</strong><br>";
                data.forEach(q => html += `[${q.role}] ${q.order}. ${q.question_text}<br>`);
                document.getElementById('q_display').innerHTML = html;
            });
        }

        function addQuestion() {
            let question_text = document.getElementById('q_text').value;
            let order = document.getElementById('q_order').value;
            let role = document.getElementById('q_role').value;
            fetch('/add_question', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question_text, order, role})})
            .then(r=>r.json()).then(d=>{ alert(d.message); loadQuestions(); });
        }

        function addUser() {
            let name = document.getElementById('u_name').value;
            let phone = document.getElementById('u_phone').value;
            let role = document.getElementById('u_role').value;
            fetch('/add_user', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, phone, role})})
            .then(r=>r.json()).then(d=>alert(d.message));
        }

        function triggerExam() {
            if(confirm("Start exam for all?")) fetch('/trigger_exam', {method:'POST'}).then(r=>r.json()).then(d=>alert(d.message));
        }

        function sendAnn() {
            let message = document.getElementById('ann_msg').value;
            fetch('/send_announcement', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message})})
            .then(r=>r.json()).then(d=>{ alert(d.message); document.getElementById('ann_msg').value=''; });
        }

        window.onload = function() { updateStats(); loadQuestions(); };
    </script>
</body>
</html>
